<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editorial</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background-color: #f9f7f2;
  color: #333;
}
.topbar {
  background-color: #f2ead8;
  color: #5b4b36;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 20px;
  font-size: 0.9rem;
  border-bottom: 1px solid #e2d6b8;
}
nav {
  background-color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 18px;
  padding: 15px 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  border-bottom: 3px solid #d2b48c;
}
nav a {
  text-decoration: none;
  color: #5b4b36;
  font-weight: 600;
  letter-spacing: 0.5px;
  transition: 0.3s;
}
nav a:hover {
  color: #a8864a;
}
nav a.active {
  border-bottom: 2px solid #a8864a;
  padding-bottom: 2px;
  color: #a8864a;
}
main {
  max-width: 1100px;
  margin: 40px auto;
  padding: 0 20px;
}
.article {
  background-color: #fff;
  padding: 20px;
  margin-bottom: 25px;
  border-radius: 8px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  text-align: center; /* Centers content inside */
}
.article img {
  display: block;
  margin: 0 auto 15px auto; /* Centers image horizontally */
  max-width: 80%; /* Prevents it from being too wide */
  height: auto;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}
.article h2 {
  margin-top: 10px;
  color: #3d3527;
}
footer {
  text-align: center;
  padding: 20px;
  background-color: #f2ead8;
  color: #5b4b36;
  font-size: 0.9rem;
  margin-top: 60px;
}
</style>
</head>
<body>

<div class="topbar">
  <div id="datetime"></div>
</div>

<nav>
  <a href="index.html">Home</a>
  <a href="newspage.html">News</a>
  <a href="Editorial.html" class="active">Editorial</a>
  <a href="comics.html">Comics</a>
  <a href="fashion.html">Fashion</a>
  <a href="entertainment.html">Entertainment</a>
  <a href="sports.html">Sports</a>
  <a href="weather and traffic.html">Weather & Traffic Tracker</a>
</nav>

<main>
  <section class="article">
    <img src="img/Edt1.jpg" alt="Storming Through Editorial">
    <h2>Editorial Cartoon: STORMING THROUGH</h2> 
  </section>

  <section class="article">
    <img src="img/Edt2.jpg" alt="His Time Has Come">
    <h2>Editorial Cartoon: HIS TIME HAS COME</h2>
  </section>

  <section class="article">
    <img src="img/Edt3.jpg" alt="Corruption Wins">
    <h2>Editorial Cartoon: CORRUPTION WINS</h2>
  </section>
</main>

<script>
function updateTime() {
  const now = new Date();
  document.getElementById('datetime').textContent =
    now.toLocaleString('en-US', {
      weekday:'short',
      month:'long',
      day:'numeric',
      year:'numeric',
      hour:'numeric',
      minute:'2-digit',
      second:'2-digit'
    });
}
setInterval(updateTime, 1000);
updateTime();
</script>

</body>
</html>
